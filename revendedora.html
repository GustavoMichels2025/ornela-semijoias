<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ornela | Área da revendedora</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#302820;font:14px Arial,sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}h1{font-size:24px;letter-spacing:3px;font-weight:400}h2{font-size:18px}section{margin:20px 0;padding:20px;border:1px solid #e3dbcf;border-radius:10px;background:white}form{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:10px;border:1px solid #d9cbb6;border-radius:5px;font:inherit;max-width:100%}button{cursor:pointer;background:#f2eadc}button:disabled{opacity:.5;cursor:wait}label{display:grid;gap:6px}#loginBox{max-width:460px;margin:50px auto}#loginBox form,#loginBox label{width:100%}#loginBox input{width:100%}.scroll{overflow:auto;max-height:55vh}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border:1px solid #e5dfd5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eee7dc}tr:nth-child(even){background:#faf8f5}#message{white-space:pre-line;line-height:1.5}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.totals{line-height:1.8}[hidden]{display:none!important}@media(max-width:600px){main{margin:12px auto;padding:12px}section{padding:12px}input,select{font-size:16px}}
</style></head><body><main><h1>ORNELA SEMIJOIAS</h1><p>Área exclusiva da revendedora</p><p id="message" role="status" aria-live="polite"></p>
<section id="loginBox"><h2>Entrar</h2><form id="loginForm"><label>Login<input id="login" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p>Solicite seu login e sua senha à loja.</p></section>
<div id="portal" hidden><nav><strong id="name"></strong><button id="refresh">Atualizar</button><button id="logout">Sair</button></nav>
<section><h2>Meu estoque</h2><div id="inventory" class="scroll"></div></section>
<section><h2>Registrar venda</h2><p>A venda dá baixa somente nas peças que estão com você.</p><form id="saleForm"><label>Produto<select id="product" required></select></label><label>Quantidade<input id="qty" type="number" min="1" step="1" value="1" required></label><button>Confirmar venda</button></form></section>
<section><h2>Minhas vendas</h2><p id="totals" class="totals"></p><button id="download">Baixar relatório CSV</button><div id="sales" class="scroll"></div></section></div>
<p><a href="/">Voltar à vitrine</a></p></main><script>
const api='/.netlify/functions/reseller',key='ornelaResellerToken';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,busy=false;
const money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const table=(heads,rows)=>'<table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
async function request(method='GET',body){const r=await fetch(api,{method,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.getItem(key)||'')},...(body?{body:JSON.stringify(body)}:{})});const result=await r.json();if(!r.ok){if(r.status===401){sessionStorage.removeItem(key);$('portal').hidden=true;$('loginBox').hidden=false}throw Error(result.error||'Falha ao acessar.')}return result}
async function refresh(){data=await request();$('loginBox').hidden=true;$('portal').hidden=false;$('name').textContent=data.name;const inventory=data.inventory.filter(i=>i.qty>0);$('inventory').innerHTML=table(['Código','Produto','Quantidade','Preço R$'],inventory.map(i=>[i.code,i.name,i.qty,i.price]));$('product').innerHTML='<option value="">Selecione uma peça</option>'+inventory.map(i=>'<option value="'+esc(i.productKey)+'">'+esc(i.name)+' • '+esc(i.code)+' • saldo '+i.qty+'</option>').join('');$('sales').innerHTML=table(['Data','Código','Produto','Quantidade','Total R$'],data.sales.map(s=>[s.date,s.code,s.name,s.qty,money(s.total)]));const total=data.sales.reduce((sum,s)=>sum+Number(s.total||0),0);$('totals').textContent='Total vendido: R$ '+money(total)+' • Comissão estimada ('+data.commission+'%): R$ '+money(total*data.commission/100)}
$('loginForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const result=await request('POST',{action:'login',login:$('login').value,password:$('password').value});sessionStorage.setItem(key,result.token);$('password').value='';await refresh();$('message').textContent=''}catch(e){$('message').textContent=e.message}finally{button.disabled=false}};
$('saleForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const item=data?.inventory.find(i=>i.productKey===$('product').value),qty=Number($('qty').value);if(!item||!Number.isInteger(qty)||qty<1||qty>item.qty){$('message').textContent='Selecione um produto e uma quantidade dentro do seu saldo.';return}if(!confirm('Registrar '+qty+' unidade(s) de '+item.name+' como vendida(s)?'))return;busy=true;e.submitter.disabled=true;try{await request('POST',{action:'sale',productKey:item.productKey,qty,saleId:crypto.randomUUID()});await refresh();$('qty').value=1;$('message').textContent='Venda registrada e estoque atualizado.'}catch(err){$('message').textContent=err.message}finally{busy=false;e.submitter.disabled=false}};
$('refresh').onclick=async()=>{try{await refresh();$('message').textContent='Dados atualizados.'}catch(e){$('message').textContent=e.message}};
$('logout').onclick=()=>{sessionStorage.removeItem(key);location.reload()};
$('download').onclick=()=>{if(!data)return;const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Data','Código','Produto','Quantidade','Total R$'],...data.sales.map(s=>[s.date,s.code,s.name,s.qty,money(s.total)])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minhas-vendas-ornela.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(sessionStorage.getItem(key))refresh().catch(e=>$('message').textContent=e.message);
</script></body></html>
